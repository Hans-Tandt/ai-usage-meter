<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" role="img" aria-label="Comment la fenêtre de contexte se remplit pendant une session, ce que garde le compactage, et comment la vue Session vous prévient à 80 et 90 pour cent">
<rect width="680" height="430" rx="10" fill="#FFFFFF"/>
<text x="660" y="22" text-anchor="end" font-size="12" fill="#6B7280">fenêtre de contexte = la mémoire de travail d’une session</text>
<text x="20" y="44" font-size="16" font-weight="700" fill="#1F2F4A">1. Début de la session</text><rect x="20" y="52" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="53" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">règles</text><rect x="111" y="53" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="146" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">tâche</text><text x="20" y="104" font-size="13" fill="#3A414D" text-anchor="start">Beaucoup de place. Claude voit chaque règle et chaque détail.</text>
<text x="20" y="138" font-size="16" font-weight="700" fill="#1F2F4A">2. Après une longue journée</text><rect x="20" y="146" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="147" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">règles</text><rect x="111" y="147" width="160" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="191" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">conversation</text><rect x="273" y="147" width="290" height="32" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="418" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#712B13">gros résultats et lectures de fichiers</text><rect x="565" y="147" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="600" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">plus</text><text x="20" y="198" font-size="13" fill="#3A414D" text-anchor="start">Presque pleine. Les premières règles comptent moins ; les réponses deviennent floues.</text>
<text x="20" y="232" font-size="16" font-weight="700" fill="#1F2F4A">3. Après le compactage</text><rect x="20" y="240" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="241" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">règles</text><rect x="111" y="241" width="150" height="32" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="186" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">résumé</text><text x="20" y="292" font-size="13" fill="#3A414D" text-anchor="start">De la place à nouveau, mais les détails ont disparu : chemins, chiffres, décisions.</text>
<text x="20" y="326" font-size="16" font-weight="700" fill="#1F2F4A">4. Avec la vue Session</text><rect x="20" y="334" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="335" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">règles</text><rect x="111" y="335" width="380" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="301" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">votre travail</text>
<line x1="532" y1="328" x2="532" y2="376" stroke="#BA7517" stroke-width="2.5" stroke-dasharray="5 3"/><line x1="596" y1="328" x2="596" y2="376" stroke="#E24B4A" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="532" y="392" font-size="13" fill="#3A414D" text-anchor="middle">80 % : notes</text><text x="660" y="410" font-size="13" fill="#3A414D" text-anchor="end">90 % : nouvelle session</text><text x="20" y="392" font-size="13" fill="#3A414D" text-anchor="start">Prévenu à temps : d’abord les notes, puis une nouvelle session.</text>
</svg>
