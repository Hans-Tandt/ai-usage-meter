<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="Segoe UI, system-ui, -apple-system, Roboto, Arial, sans-serif" role="img" aria-label="Hoe het contextvenster tijdens een sessie volloopt, wat het samenvatten overhoudt, en hoe de sessieweergave waarschuwt bij 80 en 90 procent">
<rect width="680" height="430" rx="10" fill="#FFFFFF"/>
<text x="660" y="22" text-anchor="end" font-size="12" fill="#6B7280">contextvenster = het werkgeheugen van één sessie</text>
<text x="20" y="44" font-size="16" font-weight="700" fill="#1F2F4A">1. Begin van de sessie</text><rect x="20" y="52" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="53" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">regels</text><rect x="111" y="53" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="146" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">taak</text><text x="20" y="104" font-size="13" fill="#3A414D" text-anchor="start">Veel ruimte. Claude ziet elke regel en elk detail.</text>
<text x="20" y="138" font-size="16" font-weight="700" fill="#1F2F4A">2. Na een lange dag</text><rect x="20" y="146" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="147" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">regels</text><rect x="111" y="147" width="160" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="191" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">gesprek</text><rect x="273" y="147" width="290" height="32" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="418" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#712B13">grote zoekresultaten en bestanden</text><rect x="565" y="147" width="70" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="600" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">meer</text><text x="20" y="198" font-size="13" fill="#3A414D" text-anchor="start">Bijna vol. De eerste regels krijgen minder aandacht; antwoorden worden vager.</text>
<text x="20" y="232" font-size="16" font-weight="700" fill="#1F2F4A">3. Na het samenvatten</text><rect x="20" y="240" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="241" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">regels</text><rect x="111" y="241" width="150" height="32" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/><text x="186" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">samenvatting</text><text x="20" y="292" font-size="13" fill="#3A414D" text-anchor="start">Weer ruimte, maar de details zijn weg: paden, cijfers, beslissingen.</text>
<text x="20" y="326" font-size="16" font-weight="700" fill="#1F2F4A">4. Met de sessieweergave</text><rect x="20" y="334" width="640" height="34" rx="4" fill="#F7F6F2" stroke="#9AA0AA"/><rect x="21" y="335" width="88" height="32" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="65" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">regels</text><rect x="111" y="335" width="380" height="32" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="301" y="356" text-anchor="middle" font-size="13" font-weight="600" fill="#0C447C">uw werk</text>
<line x1="532" y1="328" x2="532" y2="376" stroke="#BA7517" stroke-width="2.5" stroke-dasharray="5 3"/><line x1="596" y1="328" x2="596" y2="376" stroke="#E24B4A" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="532" y="392" font-size="13" fill="#3A414D" text-anchor="middle">80 %: notities</text><text x="660" y="410" font-size="13" fill="#3A414D" text-anchor="end">90 %: nieuwe sessie</text><text x="20" y="392" font-size="13" fill="#3A414D" text-anchor="start">Op tijd gewaarschuwd: eerst notities, dan een nieuwe sessie.</text>
</svg>
